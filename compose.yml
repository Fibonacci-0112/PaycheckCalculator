services:
  postgres:
    image: postgres:18
    container_name: paycheckcalculator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: paycheckcalculator_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d paycheckcalculator_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
