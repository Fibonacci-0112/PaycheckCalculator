services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    environment:
      POSTGRES_DB: paycheckcalc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - paycheckcalc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paycheckcalc"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  paycheckcalc-postgres-data:
