# GitLab CI/CD pipeline for PaycheckCalc
#
# Mirrors .github/workflows/dotnet.yml: restores, builds, and tests
# PaycheckCalc.Tests on Linux. The MAUI and Blazor apps are not built
# here (the test project transitively builds Core + Shared + Api, which
# is all CI needs and none of it requires the MAUI workload).
#
# The SDK version is pinned to match global.json. Because that is a
# preview build that may not ship in the prebuilt SDK images, we start
# from a base SDK image and install the exact version with the official
# dotnet-install script.
#
# To use this as the project pipeline, either rename it to
# `.gitlab-ci.yml` or point CI/CD > Settings > "CI/CD configuration file"
# at `dotnet-gitlab.yml`.

stages:
  - build_and_test

variables:
  DOTNET_VERSION: "11.0.100-preview.5.26302.115"
  # Keep restored packages inside the project dir so they can be cached.
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

build_and_test:
  stage: build_and_test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  cache:
    key:
      files:
        - PaycheckCalc.Tests/PaycheckCalc.Tests.csproj
    paths:
      - .nuget/packages
  before_script:
    # Install the exact preview SDK pinned in global.json alongside the
    # base image's SDK, then put it first on PATH.
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
    - chmod +x dotnet-install.sh
    - ./dotnet-install.sh --version "$DOTNET_VERSION" --install-dir "$CI_PROJECT_DIR/.dotnet"
    - export PATH="$CI_PROJECT_DIR/.dotnet:$PATH"
    - dotnet --info
  script:
    - export PATH="$CI_PROJECT_DIR/.dotnet:$PATH"
    - dotnet restore PaycheckCalc.Tests
    - dotnet build PaycheckCalc.Tests --no-restore
    - dotnet test PaycheckCalc.Tests --no-build --verbosity normal
  rules:
    # Build on pushes to the default branch and on merge requests,
    # matching the GitHub workflow's push/pull_request triggers.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
