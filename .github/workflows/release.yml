name: Release

# CD: on a v* tag, build every shippable artifact and attach it to a GitHub Release.
#
# Signing is deliberately optional. Every artifact that can be produced without secrets is
# always produced; the ones that need a signing identity are signed only when the relevant
# secrets exist, and otherwise ship unsigned rather than failing the release. That keeps
# the pipeline usable in a fork or before certificates are set up.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (defaults to the current ref)
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: none
          cache-key-suffix: release-verify
      - name: Run the test suite
        run: dotnet test PaycheckCalculator.Tests -c Release

  web:
    name: Blazor + sync API
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: none
          cache-key-suffix: release-web

      - name: Publish Blazor
        run: dotnet publish PaycheckCalculator.Blazor -c Release -o ./out/blazor

      - name: Publish sync API
        run: dotnet publish PaycheckCalculator.Api -c Release -o ./out/api

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd ./out/blazor && zip -qr ../../dist/PaycheckCalculator.Blazor.zip .)
          (cd ./out/api && zip -qr ../../dist/PaycheckCalculator.Api.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist

  android:
    name: Android package
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android
          android-sdk: 'true'
          cache-key-suffix: release-android

      - name: Decode the signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; producing an unsigned package."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish AAB and APK
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          signing_args=()
          if [ "$SIGNED" = "true" ]; then
            signing_args=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
              -p:AndroidSigningStorePass='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
              -p:AndroidSigningKeyAlias='${{ secrets.ANDROID_KEY_ALIAS }}'
              -p:AndroidSigningKeyPass='${{ secrets.ANDROID_KEY_PASSWORD }}'
            )
          fi
          dotnet publish PaycheckCalculator.App -f net11.0-android -c Release \
            -p:AndroidPackageFormat=aab "${signing_args[@]}" -o ./out/android-aab
          dotnet publish PaycheckCalculator.App -f net11.0-android -c Release \
            -p:AndroidPackageFormat=apk "${signing_args[@]}" -o ./out/android-apk

      - name: Collect
        run: |
          mkdir -p dist
          find ./out -name '*.aab' -o -name '*.apk' | xargs -I{} cp {} dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist

  windows:
    name: Windows package
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui
          cache-key-suffix: release-windows

      - name: Publish
        run: >-
          dotnet publish PaycheckCalculator.App
          -f net11.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifier=win-x64 -p:PublishReadyToRun=true
          -o ./out/windows

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd ./out/windows && 7z a -tzip ../../dist/PaycheckCalculator-windows-x64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist

  maccatalyst:
    name: Mac Catalyst package
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui
          cache-key-suffix: release-maccatalyst

      - name: Publish
        # Ad-hoc signed. Distributing outside the Mac App Store additionally requires a
        # Developer ID certificate and notarisation, which need Apple account secrets.
        run: >-
          dotnet publish PaycheckCalculator.App
          -f net11.0-maccatalyst -c Release
          -p:RuntimeIdentifier=maccatalyst-arm64
          -o ./out/maccatalyst

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle=$(find ./out/maccatalyst -maxdepth 2 -name '*.app' -type d | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::No .app bundle was produced."
            exit 1
          fi
          ditto -c -k --keepParent "$bundle" dist/PaycheckCalculator-maccatalyst-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-maccatalyst
          path: dist

  ios:
    name: iOS package
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui
          cache-key-suffix: release-ios

      - name: Check for Apple signing secrets
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No APPLE_CERTIFICATE_BASE64 secret. Building for the Simulator only — a distributable .ipa requires a signing identity and provisioning profile."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for the Simulator (unsigned)
        if: steps.signing.outputs.available == 'false'
        run: >-
          dotnet build PaycheckCalculator.App
          -f net11.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64

      - name: Import the signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          profiles=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$profiles"
          echo "$PROFILE" | base64 -d > "$profiles/build.mobileprovision"

      - name: Publish signed .ipa
        if: steps.signing.outputs.available == 'true'
        run: >-
          dotnet publish PaycheckCalculator.App
          -f net11.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey='${{ secrets.APPLE_CODESIGN_KEY }}'
          -p:CodesignProvision='${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}'
          -o ./out/ios

      - name: Collect
        if: steps.signing.outputs.available == 'true'
        run: |
          mkdir -p dist
          find ./out/ios -name '*.ipa' -exec cp {} dist/ \;

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: release-ios
          path: dist

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ web, android, windows, maccatalyst, ios ]
    if: always() && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ./dist
          merge-multiple: true

      - name: List what is being released
        run: ls -lR ./dist

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: ./dist/**/*
