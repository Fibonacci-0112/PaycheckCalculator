name: MAUI build

# Builds PaycheckCalculator.App for every target platform and publishes the binaries as
# artifacts. This needs three different runner operating systems, because the MAUI target
# frameworks are not portable across hosts:
#
#   net11.0-android              Linux, Windows or macOS  (built here on Linux)
#   net11.0-windows…             Windows only  — WinUI/WindowsAppSDK
#   net11.0-ios                  macOS only    — Xcode
#   net11.0-maccatalyst          macOS only    — Xcode
#
# The csproj itself encodes this: the ios/maccatalyst TargetFrameworks are added only when
# building on macOS and the windows one only on Windows. So a Linux-only pipeline can never
# compile three of the four targets, no matter how it is configured.
#
# Actually *running* the app lives in maui-uitests.yml.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maui-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  android:
    name: Android (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui-android
          android-sdk: 'true'
          cache-key-suffix: android

      - name: Build (Debug)
        # Debug first: it is what the UI tests install, so a Debug-only break should fail
        # here rather than in the much slower emulator job.
        run: dotnet build PaycheckCalculator.App -f net11.0-android -c Debug

      - name: Publish (Release APK)
        run: >-
          dotnet publish PaycheckCalculator.App -f net11.0-android -c Release
          -p:AndroidPackageFormat=apk
          -o ./artifacts/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maui-android
          path: |
            ./artifacts/android/*.apk
            PaycheckCalculator.App/bin/Debug/net11.0-android/*-Signed.apk
          retention-days: 14

  windows:
    name: Windows (WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui
          cache-key-suffix: windows

      - name: Build (Debug)
        run: dotnet build PaycheckCalculator.App -f net11.0-windows10.0.19041.0 -c Debug

      - name: Publish (Release)
        # WindowsPackageType=None in the csproj: this produces a plain unpackaged .exe,
        # so there is no MSIX to sign and no certificate needed in CI.
        run: >-
          dotnet publish PaycheckCalculator.App -f net11.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifier=win-x64
          -o ./artifacts/windows

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: maui-windows
          path: ./artifacts/windows
          retention-days: 14

  apple:
    name: ${{ matrix.name }} (macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            framework: net11.0-ios
            rid: iossimulator-arm64
            artifact: maui-ios-simulator
          - name: Mac Catalyst
            framework: net11.0-maccatalyst
            rid: maccatalyst-arm64
            artifact: maui-maccatalyst
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dotnet-maui
        with:
          workloads: maui
          cache-key-suffix: apple-${{ matrix.framework }}

      - name: Build ${{ matrix.name }}
        # Simulator and Mac Catalyst builds are ad-hoc signed, so no Apple Developer
        # certificate or provisioning profile is needed. A build for a physical iOS device
        # (or for notarised distribution) does need real signing secrets — see release.yml.
        run: >-
          dotnet build PaycheckCalculator.App
          -f ${{ matrix.framework }} -c Debug
          -p:RuntimeIdentifier=${{ matrix.rid }}

      - name: Locate the .app bundle
        id: locate
        run: |
          set -euo pipefail
          bundle=$(find PaycheckCalculator.App/bin/Debug/${{ matrix.framework }} \
                     -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::No .app bundle was produced for ${{ matrix.framework }}."
            exit 1
          fi
          echo "Found $bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Upload ${{ matrix.name }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.locate.outputs.bundle }}
          retention-days: 14

  summary:
    name: MAUI build summary
    runs-on: ubuntu-latest
    needs: [ android, windows, apple ]
    if: always()
    steps:
      - name: Report per-platform status
        run: |
          {
            echo "| Target | Runner | Result |"
            echo "| --- | --- | --- |"
            echo "| net11.0-android | ubuntu-latest | ${{ needs.android.result }} |"
            echo "| net11.0-windows10.0.19041.0 | windows-latest | ${{ needs.windows.result }} |"
            echo "| net11.0-ios + net11.0-maccatalyst | macos-latest | ${{ needs.apple.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any platform failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
