# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.100-preview.5.26302.115
    - name: Restore dependencies
      run: dotnet restore PaycheckCalculator.Tests
    - name: Build
      run: dotnet build PaycheckCalculator.Tests --no-restore
    - name: Test
      run: dotnet test PaycheckCalculator.Tests --no-build --verbosity normal
