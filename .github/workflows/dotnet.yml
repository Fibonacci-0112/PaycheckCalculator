# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    # PaycheckCalc.App (MAUI) targets net10.0-android / net10.0-windows, neither of
    # which builds on this Linux runner (no MAUI workload installed, and the Windows
    # head only builds on Windows). CI therefore validates PaycheckCalc.Tests (which
    # compiles PaycheckCalc.Core and runs the full test suite) and PaycheckCalc.Blazor
    # (standard ASP.NET Core, builds on Linux without additional workloads).
    - name: Restore — Tests
      run: dotnet restore PaycheckCalc.Tests
    - name: Build — Tests
      run: dotnet build PaycheckCalc.Tests --no-restore
    - name: Test
      run: dotnet test PaycheckCalc.Tests --no-build --verbosity normal
    - name: Restore — Blazor
      run: dotnet restore PaycheckCalc.Blazor
    - name: Build — Blazor
      run: dotnet build PaycheckCalc.Blazor --no-restore
